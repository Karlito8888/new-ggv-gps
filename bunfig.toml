[install]
# bun.lock has configVersion 1, so workspaces would default to the isolated linker.
# Expo (Metro, expo-doctor) needs a flat node_modules: measured 21/21 hoisted vs 20/21 isolated.
linker = "hoisted"
# Wait 7 days before resolving a newly published version (supply-chain hygiene, enforced by the
# Semgrep gate). A fresh release that cannot wait goes in `minimumReleaseAgeExcludes = ["<pkg>"]`
# below, for that package only: `--minimum-release-age=0` would lift the check for every
# package resolved in that install.
minimumReleaseAge = 604800
# expo-location 57.0.21, expo-dev-client 57.0.20 and its dependency expo-dev-launcher 57.0.21 were
# all published 2026-10-12: already in bun.lock but younger than 7 days, so any re-resolve refuses
# them without this line. Drop the line and this comment after 2026-10-19.
minimumReleaseAgeExcludes = ["expo-location", "expo-dev-client"]
