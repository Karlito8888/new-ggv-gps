name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/workflows/deploy.yml"

# One deploy at a time, in push order: the last push is the version left live.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true

      # A red gate never reaches production: quality.yml runs in parallel, not before.
      - run: vp run gate

      - run: vp run build

      # Workers static assets plus the `/tiles/*` byte-range Worker (apps/web/wrangler.jsonc).
      # The token is `charlesbourgault-setup-deploy`, scoped to this account and zone.
      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: vpx wrangler@4.158.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # A green upload is not proof: production must serve the bundle this run built.
      - name: Verify the served bundle
        run: |
          built=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' apps/web/dist/index.html | head -1)
          for i in 1 2 3 4 5 6; do
            live=$(curl -s "https://myggvgps.charlesbourgault.com/?cb=$RANDOM$i" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ "$live" = "$built" ]; then echo "Production serves $live"; exit 0; fi
            sleep 10
          done
          echo "::error::Production serves ${live:-nothing}, this build is $built"
          exit 1
